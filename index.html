<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fa8">
<title>AttivaMente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AttivaMente – Il laboratorio dei giochi da creare. Crea a mano labirinti, mandala e altri giochi, controllali e stampali.">
<meta name="theme-color" content="#1f5fa8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: banco di lavoro su carta a quadretti — barra in alto, area di lavoro quadrata, strumenti accanto (sotto su telefono) */
:root{
  --paper:#f6f8fb; --card:#ffffff; --ink:#1b2735; --graphite:#566273; --rule:#d6dee8; --grid:#e6ecf3;
  --accent:#1f5fa8; --accent-ink:#ffffff; --mark:#ffd84d; --mark-ink:#2a2200;
  --ok:#2b7a4b; --warn:#a85f00; --soft:#eaf1fa;
  --f-display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --scale:1; --hit:44px; --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171f; --card:#18212c; --ink:#e7edf4; --graphite:#9eabba; --rule:#2c3948; --grid:#1d2834;
  --accent:#86b6ee; --accent-ink:#0d1520; --mark:#e5c03c; --mark-ink:#1a1500;
  --ok:#6cc38f; --warn:#e6a54d; --soft:#1c2a3a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11171f; --card:#18212c; --ink:#e7edf4; --graphite:#9eabba; --rule:#2c3948; --grid:#1d2834;
  --accent:#86b6ee; --accent-ink:#0d1520; --mark:#e5c03c; --mark-ink:#1a1500;
  --ok:#6cc38f; --warn:#e6a54d; --soft:#1c2a3a; color-scheme:dark }
:root.hc{ --ink:#000; --graphite:#1b1b1b; --rule:#000; --paper:#fff; --card:#fff; --accent:#0033aa; --grid:#cfd8e3 }
@media (prefers-color-scheme: dark){:root.hc:not([data-theme="light"]){ --ink:#fff; --graphite:#f0f0f0; --rule:#fff; --paper:#000; --card:#000; --accent:#9cc8ff; --grid:#333 }}
:root.hc[data-theme="dark"]{ --ink:#fff; --graphite:#f0f0f0; --rule:#fff; --paper:#000; --card:#000; --accent:#9cc8ff; --grid:#333 }
:root.big{ --scale:1.2 } :root.huge{ --scale:1.45 }
:root.tremor{ --hit:56px }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:calc(17px * var(--scale));line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
:root.calm *{transition:none!important;animation:none!important}

/* barra */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:calc(26px * var(--scale));letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--accent)}
.brand small{display:block;color:var(--graphite);font-size:.78em;line-height:1.2}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{min-height:var(--hit);display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.nav a[aria-current="page"]{border-color:var(--rule);background:var(--card);font-weight:700}

/* pulsanti */
.btn{min-height:var(--hit);padding:0 16px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78em;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--graphite);white-space:nowrap}
.chip.solido{color:var(--ok);border-color:currentColor}
.chip.promettente{color:var(--accent);border-color:currentColor}
.chip.plausibile{color:var(--warn);border-color:currentColor}
.label{font-size:.75em;text-transform:uppercase;letter-spacing:.08em;color:var(--graphite);font-weight:700}

/* home */
.hero{padding-block:36px 24px;display:grid;gap:14px;max-width:780px}
.hero h1{font-size:calc(40px * var(--scale));font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(transparent 60%, var(--mark) 60%);padding:0 .1em}
.hero p{font-size:1.08em;color:var(--graphite);max-width:62ch}
.families{display:grid;gap:28px;margin-top:12px}
.family h2{font-size:calc(22px * var(--scale));margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.family h2 small{font-family:var(--f-body);font-weight:400;font-size:.68em;color:var(--graphite)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tool{display:grid;gap:10px;align-content:start;padding:16px;border:1px solid var(--rule);border-radius:14px;background:var(--card);text-decoration:none;color:var(--ink);min-height:150px}
a.tool:hover{border-color:var(--accent)}
.tool.soon{background:transparent;border-style:dashed;color:var(--graphite)}
.tool .ico{width:52px;height:52px}
.tool h3{font-size:1.1em}
.tool p{font-size:.88em;color:var(--graphite)}
.tool .row{justify-content:space-between}
.note{margin-top:28px;padding:16px;border-left:4px solid var(--mark);background:var(--card);border-radius:0 10px 10px 0;max-width:780px;font-size:.92em;color:var(--graphite)}

/* strumento */
.toolhead{display:grid;gap:8px;padding-block:24px 14px}
.toolhead h1{font-size:calc(30px * var(--scale));font-weight:800}
.toolhead p{color:var(--graphite);max-width:68ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.sheet .titles{display:grid;gap:2px;text-align:center}
.sheet .titles h2{font-size:1.3em}
.sheet .titles p{color:var(--graphite);font-style:italic}
.board{width:100%;max-width:min(100%, 78vh);margin:0 auto;aspect-ratio:1/1;touch-action:none;user-select:none;-webkit-user-select:none;
  background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);background-size:20px 20px;border-radius:8px}
.board svg{width:100%;height:100%;display:block}
.side{display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:10px}
.panel h3{font-size:1em;font-family:var(--f-body);font-weight:700}
.field{display:grid;gap:4px}
.field input,.field select{min-height:var(--hit);padding:0 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{padding:0 12px;font-weight:400}
.seg .btn[aria-pressed="true"]{font-weight:700}
.msg{padding:12px 14px;border-radius:10px;background:var(--soft);font-size:.95em;display:grid;gap:4px}
.msg b{font-weight:700}
.msg.ok{border-left:4px solid var(--ok)} .msg.info{border-left:4px solid var(--accent)} .msg.warn{border-left:4px solid var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stats div{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px;text-align:center}
.stats strong{display:block;font-size:1.3em;font-family:var(--f-display)}
.stats span{font-size:.75em;color:var(--graphite)}
.steps{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.93em}
.check{display:flex;gap:10px;align-items:center;min-height:var(--hit);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.evidence{font-size:.88em;color:var(--graphite)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--warn);border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}

/* lavori */
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.work{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px;display:grid;gap:8px}
.work .thumb{aspect-ratio:1/1;background:var(--paper);border-radius:8px;overflow:hidden}
.work .thumb svg{width:100%;height:100%}
.work h3{font-size:1em;font-family:var(--f-body)}
.work small{color:var(--graphite)}
textarea{width:100%;min-height:120px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}

/* impostazioni */
.settings{display:grid;gap:16px;max-width:760px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.profiles .btn{flex-direction:column;align-items:flex-start;justify-content:center;padding:10px 14px;height:auto;min-height:72px;text-align:left}
.profiles .btn small{font-weight:400;color:var(--graphite);font-size:.8em}

.print-only{display:none}
@media print{
  @page{margin:14mm}
  body{padding:0;background:#fff;color:#000;font-size:14pt}
  .top,.side,.toolhead,.nav,.noprint,.toast{display:none!important}
  .bench{display:block}
  .sheet{border:none;padding:0}
  .board{background:none!important;max-width:100%;width:100%}
  .board .guide,.board .hit,.board .sel,.board .unreach,.board .sugg{display:none}
  .print-only{display:block}
  .solpage{break-before:page}
}

/* strumenti v1 */
.board.paper{background-image:none}
.board.wide{aspect-ratio:1080/560;max-width:100%}
.boardfree{width:100%;max-width:min(100%,92vh);margin:0 auto;user-select:none;-webkit-user-select:none}
.boardfree svg{width:100%;height:auto;display:block}
.boardfree.nono{touch-action:none}
.btn.small{min-height:40px;padding:0 10px;font-size:.9em}
.btn.on,.btn[aria-pressed="true"].small{outline:3px solid var(--accent);outline-offset:-3px}
.motifs{display:grid;gap:8px}
.motif summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,var(--hit));gap:6px;justify-content:start}
.padsym{display:flex;flex-wrap:wrap;gap:6px}
.padsym .btn{padding:0 8px}
.pairrow,.piecebox{border:1px solid var(--rule);border-radius:10px;padding:10px;display:grid;gap:8px}
.pairsides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairside{display:grid;gap:6px;min-width:0}
.pairside input{min-height:var(--hit);padding:0 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);width:100%}
#pieces{display:grid;gap:8px}
.iconpick{display:flex;flex-wrap:wrap;gap:4px}
.iconpick .btn{padding:0 6px}
input.wide{min-height:var(--hit);padding:0 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);width:100%}
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;font-size:1.02em}
.clues ol{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.clues .len{color:var(--graphite);font-size:.85em}
.wordlist{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:1.15em;font-weight:700;letter-spacing:.04em}
.keyline,.explain{text-align:center;font-size:1.05em}
.explain{text-align:left;background:var(--soft);padding:10px 12px;border-radius:10px}
.bigsol{text-align:center;font-size:1.6em;font-weight:700;letter-spacing:.06em}
.sheettext{display:grid;gap:10px;font-size:1.1em}
.sheettext ol{display:grid;gap:14px;padding-left:1.4em}
.tiles{display:inline-flex;gap:6px;flex-wrap:wrap}
.tiles b{display:inline-grid;place-items:center;width:2em;height:2.2em;border:2px solid var(--ink);border-radius:6px;font-size:1.1em}
.anlist li,.indlist li{display:grid;gap:6px}
.hint{color:var(--graphite);font-style:italic}
.answer{display:block;border-bottom:2px dotted var(--graphite);height:1.8em;max-width:420px}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.92em}
.legend li{display:flex;gap:8px;align-items:center}
.legend.print{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:10px}
@media print{ .boardfree{max-width:100%} .answer{max-width:none} }
.wordchips{display:flex;flex-wrap:wrap;gap:6px;max-height:320px;overflow:auto}
.defrow{display:grid;gap:4px}
.defrow input{min-height:var(--hit);padding:0 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);width:100%}
#defs{display:grid;gap:8px;max-height:520px;overflow:auto}
.mj svg{max-height:80vh}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.pcard{border:1px dashed var(--graphite);border-radius:10px;padding:10px}
.pcard ol{gap:6px;font-size:.92em}
.ltab{border-collapse:collapse;width:100%;max-width:720px}
.ltab th,.ltab td{border:1.5px solid var(--ink);padding:8px 10px;text-align:left;min-width:3em;height:2.2em}
.rk input{width:4em;min-height:40px;border:1px solid var(--rule);border-radius:8px;padding:0 6px;background:var(--paper)}
.tablewrap{overflow-x:auto;max-width:100%}
.deb{display:grid;gap:8px}
.pagebreak{break-before:page}
.logic svg text{font-size:12px}
.padsym .btn svg{width:34px;height:34px}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.keys .btn{padding:0;justify-content:center;min-width:0}
.clues.play li{cursor:pointer;border-radius:6px;padding:2px 4px}
.clues.play li.on{background:#dbe8f7}
.clues.play li.done{color:var(--graphite)}
.wordlist .found{text-decoration:line-through;opacity:.5}
.qrbox{display:flex;justify-content:center;padding:8px}
.solview svg{max-width:100%;height:auto}
.ltab select{min-height:40px;max-width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.guide{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.guide{grid-template-columns:1fr}}
.gtoc{position:sticky;top:12px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px}
.gtoc ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.gbody{display:grid;gap:18px;max-width:72ch}
.gsec{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px;display:grid;gap:10px}
.gsec h2{font-size:1.25em}
.gsteps,.gsec ul{display:grid;gap:8px;padding-left:1.3em}
.faq dt{font-weight:700;margin-top:8px}
.faq dd{margin:2px 0 0}
.abc{text-align:center;letter-spacing:.3em;font-weight:700}
.keytab td,.keytab th{text-align:center;min-width:2.2em;padding:6px}
.work-area{min-width:0;max-width:100%}
.work-area>*{max-width:100%;min-width:0}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.15em}

</style>
</head>

<script id="core">
/* ===== Logica pura dei labirinti (testabile) ===== */
var MazeCore = (function(){
  function create(n){
    // h[r*n+c]=1: muro sotto la cella (r,c); v[r*n+c]=1: muro a destra della cella (r,c)
    var h = new Array(n*n).fill(1), v = new Array(n*n).fill(1);
    return { n:n, h:h, v:v };
  }
  function clone(m){ return { n:m.n, h:m.h.slice(), v:m.v.slice() }; }
  function inside(m,r,c){ return r>=0 && c>=0 && r<m.n && c<m.n; }
  function adjacent(a,b){ return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) === 1; }
  // restituisce [array, indice] del muro tra due celle adiacenti
  function edge(m,a,b){
    var n=m.n;
    if(a[0]===b[0]){ var c=Math.min(a[1],b[1]); return ['v', a[0]*n+c]; }
    var r=Math.min(a[0],b[0]); return ['h', r*n+a[1]];
  }
  function isOpen(m,a,b){ if(!adjacent(a,b)||!inside(m,a[0],a[1])||!inside(m,b[0],b[1])) return false; var e=edge(m,a,b); return m[e[0]][e[1]]===0; }
  function setWall(m,a,b,val){ if(!adjacent(a,b)||!inside(m,a[0],a[1])||!inside(m,b[0],b[1])) return false; var e=edge(m,a,b); if(m[e[0]][e[1]]===val) return false; m[e[0]][e[1]]=val; return true; }
  function openNeighbors(m,r,c){
    var out=[], d=[[-1,0],[1,0],[0,-1],[0,1]];
    for(var i=0;i<4;i++){ var rr=r+d[i][0], cc=c+d[i][1]; if(inside(m,rr,cc) && isOpen(m,[r,c],[rr,cc])) out.push([rr,cc]); }
    return out;
  }
  function analyze(m){
    var n=m.n, N=n*n, prev=new Array(N).fill(-1), seen=new Array(N).fill(false), q=[0]; seen[0]=true;
    while(q.length){ var k=q.shift(), r=Math.floor(k/n), c=k%n, nb=openNeighbors(m,r,c);
      for(var i=0;i<nb.length;i++){ var j=nb[i][0]*n+nb[i][1]; if(!seen[j]){ seen[j]=true; prev[j]=k; q.push(j);} } }
    var end=N-1, path=null;
    if(seen[end]){ path=[]; for(var x=end; x!==-1; x=prev[x]) path.push([Math.floor(x/n), x%n]); path.reverse(); }
    var reachable=0, unreachable=[], deadEnds=[], edgesIn=0;
    for(var k2=0;k2<N;k2++){
      var r2=Math.floor(k2/n), c2=k2%n, deg=openNeighbors(m,r2,c2).length;
      if(seen[k2]){ reachable++; edgesIn+=deg; if(deg===1 && k2!==0 && k2!==end) deadEnds.push([r2,c2]); }
      else unreachable.push([r2,c2]);
    }
    edgesIn = edgesIn/2;
    var loops = Math.max(0, edgesIn - (reachable-1));
    return { solved: !!path, path: path, pathLength: path?path.length:0, reachable: reachable, unreachable: unreachable,
             deadEnds: deadEnds, loops: loops, perfect: !!path && unreachable.length===0 && loops===0, cells:N };
  }

    if(showSol && a && a.path){ s+='<polyline points="'+a.path.map(function(p){ return (p[1]*cs+cs/2)+','+(p[0]*cs+cs/2); }).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="'+(cs*0.22)+'" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>'; }

  function cellAt(ev){

    if(dx<dy){ b=[p.r, p.fx<0.5? p.c-1 : p.c+1]; } else { b=[p.fy<0.5? p.r-1 : p.r+1, p.c]; }

  };
  document.getElementById('b-sugg').onclick=function(){
    var a=MazeCore.analyze(m);

      var n=m.n, best=null, bd=1e9; for(var r=0;r<n;r++) for(var c=0;c<n;c++){ if(a.unreachable.some(function(p){return p[0]===r&&p[1]===c;})) continue; var dd=(n-1-r)+(n-1-c); if(dd<bd){bd=dd;best=[r,c];} }

      return '<svg viewBox="-6 -6 '+(n*cs+12)+' '+(n*cs+12)+'"><path d="'+p+'" stroke="var(--ink)" stroke-width="'+Math.max(1,cs*0.12)+'" fill="none"/></svg>'; }

TOOLS.differenze = {
  id:'differenze', title:'Trova le differenze', defTitle:'Trova le differenze', ev:'plausibile',
  intro:'Prima disegni una scena a sinistra. Poi l’app ne fa una copia identica a destra, e tu la modifichi: aggiungi qualcosa, togli qualcos’altro. L’app tiene il conto delle differenze e prepara la soluzione.',
  steps:['Disegna la scena nel riquadro di sinistra: una casa, un albero, il sole bastano.','Premi Prepara la copia.','Nel riquadro di destra aggiungi qualche dettaglio o tocca una linea per toglierla.','Per un adulto vanno bene 7 differenze, per un bambino piccolo 3 o 4.','Premi Controlla e poi stampa: la soluzione va su una pagina a parte.'],
  init:function(){ return { phase:'disegna', left:[], right:null, mode:'aggiungi', width:5, smooth:false, next:1 }; },
  side:function(ctx){ var d=ctx.d;
    return '<div class="panel"><h3>A che punto sei</h3>'+seg('s-phase',[['disegna','1. Disegna la scena'],['modifica','2. Modifica la copia']],d.phase)+
      '<div id="phase-help" class="evidence"></div>'+
      '<div id="mod-tools"><h3>Nella copia</h3>'+seg('s-mode',[['aggiungi','Aggiungi'],['togli','Togli una linea']],d.mode)+'</div></div>'+
      '<div class="panel"><h3>Tratto</h3>'+seg('s-width',[[3,'Sottile'],[5,'Medio'],[9,'Spesso']],d.width)+
      '<label class="check"><input type="checkbox" id="c-smooth"'+(d.smooth||ctx.tremor?' checked':'')+'> Ammorbidisci le linee</label></div>';
  },
  syncSide:function(ctx){ setSeg('s-phase',ctx.d.phase); setSeg('s-mode',ctx.d.mode); TOOLS.differenze.help(ctx); },
  help:function(ctx){ var d=ctx.d; $('phase-help').textContent = d.phase==='disegna' ? 'Disegna nel riquadro di sinistra. Quando la scena ti piace, passa al punto 2: la copia si prepara da sola.' : 'Ora lavori solo a destra. Il disegno di sinistra resta com’è.'; $('mod-tools').hidden = d.phase!=='modifica'; },
  diffs:function(d){ if(!d.right) return { added:[], removed:[] }; var L={}, R={}; d.left.forEach(function(s){ L[s.id]=1; }); d.right.forEach(function(s){ R[s.id]=1; });
    return { added:d.right.filter(function(s){ return !L[s.id]; }), removed:d.left.filter(function(s){ return !R[s.id]; }) }; },
  bind:function(ctx){ var d=ctx.d, me=TOOLS.differenze;
    onSeg('s-phase', function(v){ ctx.change(function(){ d.phase=v; if(v==='modifica' && !d.right) d.right=clone(d.left); }); me.help(ctx); });
    onSeg('s-mode', function(v){ d.mode=v; ctx.persist(); });
    onSeg('s-width', function(v){ d.width=+v; ctx.persist(); });
    $('c-smooth').onchange=function(e){ d.smooth=e.target.checked; ctx.persist(); };
    me.help(ctx);
    // pannello: sinistra x 20..520, destra x 560..1060, y 20..520
    function panelOf(p){ if(p.y<20||p.y>520) return null; if(p.x>=20&&p.x<=520) return 'L'; if(p.x>=560&&p.x<=1060) return 'R'; return null; }
    ctx.work.addEventListener('pointerdown', function(e){
      if(d.phase!=='modifica' || d.mode!=='togli') return; var p=ctx.svgPt(e); if(!p || panelOf(p)!=='R') return;
      var lp=[p.x-560, p.y-20], best=null, bd=ctx.tremor?28:18;
      d.right.forEach(function(s,i){ var dd=distToStroke(lp,s); if(dd<bd){ bd=dd; best=i; } });
      if(best===null) return toast('Tocca proprio sopra una linea per toglierla');
      ctx.change(function(){ d.right.splice(best,1); });
    });
    freehand(ctx, { width:function(){ return d.width; },
      enabled:function(){ return d.phase==='disegna' || d.mode==='aggiungi'; },
      accept:function(p){ var pn=panelOf(p); var want=d.phase==='disegna'?'L':'R'; if(pn!==want) return null; var ox=pn==='L'?20:560; return { x:p.x-ox, y:p.y-20, meta:ox }; },
      clamp:function(p,ox){ return { x:Math.max(0,Math.min(500,p.x-ox)), y:Math.max(0,Math.min(500,p.y-20)) }; },
      live:function(st){ return '<g transform="translate('+st.meta+' 20)">'+strokePath(st)+'</g>'; },
      done:function(st){ ctx.change(function(){ var s={ id:d.next++, p:st.p, w:st.w }; if(d.phase==='disegna'){ d.left.push(s); if(d.right) d.right.push(clone(s)); } else d.right.push(s); }); } });
  },
  svg:function(ctx, marks){ var d=ctx.d, me=TOOLS.differenze, df=me.diffs(d);
    var s='<svg class="main" viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Due disegni da confrontare">';
    [[20,'Disegno'],[560,'Copia']].forEach(function(x){ s+='<rect x="'+x[0]+'" y="20" width="500" height="500" rx="14" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>'; });
    s+='<g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(20 20)">'+d.left.map(function(st){ return strokePath(st); }).join('')+'</g>';
    s+='<g transform="translate(560 20)">'+(d.right||[]).map(function(st){ return strokePath(st); }).join('')+'</g><g id="live"></g></g>';
    if(!d.right && !ctx.ui.printing) s+=txt(810,270,'La copia apparirà qui',26,{anchor:'middle',fill:'var(--graphite)'});
    if(marks){ s+='<g fill="none" stroke="var(--accent)" stroke-width="5">'; df.added.concat(df.removed).forEach(function(st){ var b=bbox(st), cx=(b[0]+b[2])/2+560, cy=(b[1]+b[3])/2+20, r=Math.max(26, Math.hypot(b[2]-b[0], b[3]-b[1])/2+16); s+='<circle cx="'+cx.toFixed(0)+'" cy="'+cy.toFixed(0)+'" r="'+r.toFixed(0)+'"/>'; }); s+='</g>'; }
    return s+'</svg>';
  },
  render:function(ctx){ ctx.work.innerHTML='<div class="board wide">'+TOOLS.differenze.svg(ctx, !!ctx.ui.showSol)+'</div>'; },
  check:function(ctx){ var d=ctx.d, df=TOOLS.differenze.diffs(d), n=df.added.length+df.removed.length;
    if(!d.left.length) return infoMsg('Il foglio è ancora vuoto.','Inizia disegnando la scena a sinistra.');
    if(!d.right) return infoMsg('La scena è pronta?','Passa al punto 2: Modifica la copia.');
    if(!n) return infoMsg('Per ora i due disegni sono identici.','Aggiungi un dettaglio a destra o togli una linea.');
    return okMsg(n+(n===1?' differenza':' differenze'), df.added.length+' aggiunte, '+df.removed.length+' tolte. Le differenze cerchiate sono nella soluzione stampata.'+(n<3?' Per un adulto puoi aggiungerne ancora qualcuna.':''));
  },
  solution:function(ctx){ return TOOLS.differenze.svg(ctx, true); }
};

TOOLS.puntini = {
  id:'puntini', title:'Unisci i puntini', defTitle:'Unisci i puntini', ev:'plausibile',
  intro:'Tocca il foglio per mettere i punti nell’ordine in cui vanno uniti: l’app li numera da sola. Alla stampa restano solo i punti e i numeri, il disegno appare a chi li unisce.',
  steps:['Pensa a una figura semplice: una casa, una stella, un pesce.','Metti il punto 1 dove inizia il contorno, poi gli altri seguendo il bordo.','Le linee leggere ti mostrano la figura mentre lavori.','Per i più piccoli bastano 10 o 15 punti, per gli adulti anche 60.','Premi Controlla: ti avvisa se due numeri sono troppo vicini.'],
  init:function(){ var pts=[], k=10; for(var i=0;i<k;i++){ var a=-Math.PI/2+i*2*Math.PI/k, r=i%2?170:360; pts.push([Math.round(500+r*Math.cos(a)), Math.round(520+r*Math.sin(a))]); } return { pts:pts, close:true, mode:'aggiungi', big:true, sel:null, example:true }; },
  side:function(ctx){ var d=ctx.d;
    return '<div class="panel"><h3>Cosa fa il tocco</h3>'+seg('s-mode',[['aggiungi','Aggiungi un punto'],['sposta','Sposta un punto'],['togli','Togli un punto']],d.mode)+'<p class="evidence" id="pm-help"></p>'+
      '<label class="check"><input type="checkbox" id="c-close"'+(d.close?' checked':'')+'> Chiudi la figura (l’ultimo punto torna al primo)</label>'+
      '<label class="check"><input type="checkbox" id="c-big"'+(d.big?' checked':'')+'> Numeri grandi</label></div>'+

  syncSide:function(ctx){ setSeg('s-mode',ctx.d.mode); $('c-close').checked=ctx.d.close; $('c-big').checked=ctx.d.big; TOOLS.puntini.help(ctx); },
  help:function(ctx){ var d=ctx.d; $('pm-help').textContent = d.mode==='aggiungi' ? 'Ogni tocco aggiunge il punto successivo.' : d.mode==='sposta' ? (ctx.tremor?'Tocca un punto, poi tocca il posto nuovo.':'Trascina un punto nel posto nuovo.') : 'Tocca un punto per toglierlo: gli altri si rinumerano.'; },
  bind:function(ctx){ var d=ctx.d, me=TOOLS.puntini, drag=null;
    onSeg('s-mode', function(v){ d.mode=v; d.sel=null; ctx.persist(); me.help(ctx); ctx.render(); });
    $('c-close').onchange=function(e){ ctx.change(function(){ d.close=e.target.checked; }); };
    $('c-big').onchange=function(e){ ctx.change(function(){ d.big=e.target.checked; }); };

    ctx.work.addEventListener('pointerdown', function(e){

      var lim=ctx.tremor?60:36;
      if(d.mode==='aggiungi'){ var close=nearest(p, ctx.tremor?45:22); if(close>=0) return toast('Troppo vicino al punto '+(close+1)+': spostati un po’');
        ctx.change(function(){ d.pts.push([Math.round(p.x),Math.round(p.y)]); d.example=false; }); var n=$('ex-note'); if(n) n.hidden=true; return; }
      if(d.mode==='togli'){ var i=nearest(p,lim); if(i<0) return toast('Tocca proprio sopra un punto'); ctx.change(function(){ d.pts.splice(i,1); }); return; }
      if(d.mode==='sposta'){
        if(ctx.tremor){ if(d.sel===null||d.sel===undefined){ var j=nearest(p,lim); if(j<0) return toast('Tocca un punto per sceglierlo'); d.sel=j; ctx.render(); } else { var k=d.sel; d.sel=null; ctx.change(function(){ d.pts[k]=[Math.round(p.x),Math.round(p.y)]; }); } return; }
        var j2=nearest(p,lim); if(j2<0) return; ctx.mark(); drag=j2; try{ ctx.work.setPointerCapture(e.pointerId); }catch(_){} }
    });
    ctx.work.addEventListener('pointermove', function(e){ if(drag===null) return; var p=ctx.svgPt(e); d.pts[drag]=[Math.round(Math.max(0,Math.min(1000,p.x))),Math.round(Math.max(0,Math.min(1000,p.y)))]; TOOLS.puntini.render(ctx); });
    function end(){ if(drag===null) return; drag=null; ctx.commit(); }

    d.pts.forEach(function(q,i){ var sel=d.sel===i; s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(sel?r*2.2:r)+'" fill="'+(sel?'var(--accent)':'var(--ink)')+'"/>'+txt(q[0]+r+4, q[1]-r-4, String(i+1), fs, {weight:700}); });
    if(d.pts.length) s+='<circle cx="'+d.pts[0][0]+'" cy="'+d.pts[0][1]+'" r="'+(r*2.4)+'" fill="none" stroke="var(--ok)" stroke-width="3"/>';
    return s+'</svg>';
  },
  render:function(ctx){ ctx.work.innerHTML='<div class="board paper">'+TOOLS.puntini.svg(ctx, ctx.ui.printing?false:true)+'</div>'; },

    var age = n<=15?'adatto ai più piccoli':(n<=40?'adatto a ragazzi e adulti':'impegnativo, per chi ha mano e vista sicure');
    return (close.length?warnMsg('Alcuni numeri potrebbero sovrapporsi.','Punti molto vicini: '+close.slice(0,6).join(', ')+(close.length>6?' e altri':'')+'. Prova a spostarli un po’.'):okMsg('I punti sono ben distanziati.',''))+infoMsg(n+' punti',age+'.');
  },
  solution:function(ctx){ return TOOLS.puntini.svg(ctx,'dark'); }
};

var OKABE=['#E69F00','#56B4E9','#009E73','#F0E442','#0072B2','#D55E00','#CC79A7','#1b2735','#999999'];
function shapeSVG(i, cx, cy, s, fill){
  var f=' fill="'+(fill||OKABE[i%9])+'" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"', h=s/2;
  switch(i){
    case 0: return '<circle cx="'+cx+'" cy="'+cy+'" r="'+h+'"'+f+'/>';
    case 1: return '<rect x="'+(cx-h*0.9)+'" y="'+(cy-h*0.9)+'" width="'+(s*0.9)+'" height="'+(s*0.9)+'"'+f+'/>';
    case 2: return '<path d="M'+cx+' '+(cy-h)+'L'+(cx+h)+' '+(cy+h*0.8)+'L'+(cx-h)+' '+(cy+h*0.8)+'Z"'+f+'/>';
    case 3: return '<path d="M'+cx+' '+(cy-h)+'L'+(cx+h)+' '+cy+'L'+cx+' '+(cy+h)+'L'+(cx-h)+' '+cy+'Z"'+f+'/>';
    case 4: var p=''; for(var k=0;k<10;k++){ var a=-Math.PI/2+k*Math.PI/5, r=k%2?h*0.45:h; p+=(k?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1); } return '<path d="'+p+'Z"'+f+'/>';

var Share = {
  b64:function(bytes){ var s=''; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },

  encode:function(obj){ var raw=new TextEncoder().encode(JSON.stringify(obj));
    if(typeof CompressionStream==='undefined') return Promise.resolve('j'+Share.b64(raw));
    return Share.pipe(raw, CompressionStream).then(function(z){ return 'z'+Share.b64(z); }); },
  decode:function(str){ var kind=str[0], bytes=Share.unb64(str.slice(1));
    if(kind==='j') return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
    if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('old'));
    return Share.pipe(bytes, DecompressionStream).then(function(b){ return JSON.parse(new TextDecoder().decode(b)); }); },
  link:function(id, payload){ return location.origin+location.pathname+'#gioca='+id+'.'+payload; },
  qr:function(el, text){ function draw(){ try{ var q=qrcode(0,'L'); q.addData(text); q.make(); el.innerHTML=q.createSvgTag(4,4); var sv=el.querySelector('svg'); if(sv){ var w=sv.getAttribute('width'); sv.setAttribute('viewBox','0 0 '+w+' '+w); sv.removeAttribute('width'); sv.removeAttribute('height'); sv.style.width='240px'; sv.style.height='240px'; sv.style.background='#fff'; } }catch(e){ el.innerHTML='<p class="evidence">Il gioco è troppo grande per un QR code: usa il link.</p>'; } }
    draw(); },
  panel:function(def){ if(!def.play) return ''; return '<div class="panel"><h3>Condividi da giocare</h3><p class="evidence">Crea un link (o un QR code): chi lo apre trova il gioco pronto sul suo telefono o computer, senza installare niente, e può risolverlo sullo schermo o stamparlo.</p><div class="row"><button class="btn" id="b-share">Crea il link da giocare</button></div><div id="share-out"></div></div>'; },
  bindPanel:function(ctx){ var def=ctx.def, b=$('b-share'); if(!b) return;

        out.innerHTML='<div class="field"><label class="label" for="share-url">Link ('+url.length+' caratteri)</label><input id="share-url" class="wide" readonly></div><div class="row"><button class="btn" id="b-copyl">Copia il link</button>'+(navigator.share?'<button class="btn" id="b-sendl">Invia…</button>':'')+'<button class="btn" id="b-qr">Mostra il QR code</button><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">Prova ad aprirlo</a></div><div id="qr-box" class="qrbox"></div>'+(framed?'<p class="evidence">Nell’anteprima il link porta a questa pagina privata: per mandarlo ad altri usa l’app pubblicata su GitHub.</p>':'');
        $('share-url').value=url;
        $('b-copyl').onclick=function(){ var i=$('share-url'); if(navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast('Link copiato'); }, function(){ i.select(); toast('Seleziona e copia il link'); }); else { i.select(); toast('Seleziona e copia il link'); } };
        var sd=$('b-sendl'); if(sd) sd.onclick=function(){ navigator.share({ title:ctx.d.title||def.title, text:(ctx.d.dedica?ctx.d.dedica+' – ':'')+'Un gioco creato con AttivaMente', url:url }).catch(function(){}); };
        $('b-qr').onclick=function(){ Share.qr($('qr-box'), url); };
      }, function(){ out.innerHTML=warnMsg('Non riesco a creare il link su questo browser.',''); }); }; }

/* ----- il giocatore: apre un gioco ricevuto ----- */
function Player(id, payload){

      $('rs-y').onclick=function(){ ctx.change(function(){ var keep=d._p; Share.decode(keep).then(function(x){ Object.keys(d).forEach(function(k){ delete d[k]; }); Object.assign(d,x); d._p=keep; if(def.play.prepare) def.play.prepare(d); ctx.persist(); ctx.render(); if(def.play.sync) def.play.sync(ctx); }); }); z.innerHTML=''; };

  }, function(){ app.innerHTML='<div class="note">Non riesco ad aprire questo gioco. Il link potrebbe essere incompleto, oppure il browser è troppo vecchio: prova con un browser aggiornato. <a href="#home">Torna ai giochi</a>.</div>'; });

/* --- cruciverba (schema e libero): stesso modo di giocare --- */
var CrossPlay = {
  steps:['Tocca una casella e scrivi con la tastiera, oppure con le lettere qui a fianco.','Tocca di nuovo la stessa casella per passare da orizzontale a verticale.','Toccando una definizione, la riga si evidenzia.','Controlla ti dice quante lettere mancano e, se vuoi, dove ci sono errori.'],
  side:function(){ return '<div class="panel"><div id="cp-clue" class="explain">Tocca una casella.</div>'+letterPad()+'<label class="check"><input type="checkbox" id="c-perr"> Segna gli errori in rosso</label></div>'; },
  prepare:function(m, d){ d.pl={}; d.psel=null; d.perr=false; },

  render:function(ctx, m){ var d=ctx.d, cs=Math.round(640/Math.max(m.w,m.h)), cur=CrossPlay.slotOf(m,d), inCur={}, nums={};
    if(cur){ cur.cells.forEach(function(p){ inCur[p[0]+','+p[1]]=1; }); d.psel.dir=cur.dir; }
    m.slots.forEach(function(s){ nums[s.cells[0][0]+','+s.cells[0][1]]=s.num; });

    for(var r=0;r<m.h;r++) for(var c=0;c<m.w;c++){ var v=m.cell(r,c), x=c*cs, y=r*cs, k=r+','+c; if(v===null) continue;
      if(v==='#'){ s+='<rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="var(--ink)"/>'; continue; }
      var sel=d.psel&&d.psel.r===r&&d.psel.c===c, L=d.pl[k]||'', bad=d.perr&&L&&L!==v;
      s+='<rect data-rc="'+k+'" x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="'+(sel?'var(--mark)':bad?'#ffd9d4':inCur[k]?'#dbe8f7':'var(--card)')+'" stroke="var(--ink)" stroke-width="2"/>';
      if(nums[k]) s+='<g pointer-events="none">'+txt(x+3,y+cs*0.26,String(nums[k]),cs*0.24,{weight:700})+'</g>';

    function list(dir){ return m.slots.filter(function(x){ return x.dir===dir; }).sort(function(a,b){ return a.num-b.num; }).map(function(x){ var done=x.cells.every(function(p){ return d.pl[p[0]+','+p[1]]; }); return '<li data-slot="'+x.dir+x.num+'" class="'+(cur===x?'on':'')+(done?' done':'')+'"><b>'+x.num+'.</b> '+esc(x.clue||'')+' <span class="len">('+x.cells.length+')</span></li>'; }).join(''); }
    ctx.work.innerHTML='<div class="board paper">'+s+'</div><div class="clues play"><div><h3>Orizzontali</h3><ol>'+list('O')+'</ol></div><div><h3>Verticali</h3><ol>'+list('V')+'</ol></div></div>';
    var cl=$('cp-clue'); if(cl) cl.innerHTML = cur ? '<b>'+cur.num+' '+(cur.dir==='O'?'orizzontale':'verticale')+'</b>: '+esc(cur.clue||'')+' ('+cur.cells.length+')' : 'Tocca una casella.'; },
  bind:function(ctx, model){ var d=ctx.d;

};
(function(){
  function schemaModel(d){ var S=TOOLS.schema.slots(d), g=d.grid; return { w:d.n, h:d.n, cell:function(r,c){ var v=g[r][c]; return v==='#'?'#':v; }, slots:S.list.map(function(s){ return { num:s.num, dir:s.dir, cells:s.cells, clue:d.defs[TOOLS.schema.slotKey(s)]||'' }; }) }; }

TOOLS.mahjong.play={ steps:TOOLS.mahjong.steps.slice(0,4), intro:'Togli le tessere a coppie uguali e libere. La partita è preparata per poter essere sempre risolta.',
  side:function(ctx){ var d=ctx.d; return '<div class="panel"><div class="row"><button class="btn" id="b-hint">'+I.bulb+'Suggerisci una coppia</button><button class="btn" id="b-shuffle">Rimescola le rimaste</button></div><div id="mj-stat" aria-live="polite"></div><label class="check"><input type="checkbox" id="c-simple"'+(d.simple?' checked':'')+'> Tessere facili</label><label class="check"><input type="checkbox" id="c-hi"'+(d.hi?' checked':'')+'> Metti in ombra le tessere bloccate</label><div hidden><div id="mj-crea"></div><div id="mj-play"></div><button id="b-deal"></button></div></div>'; },
  pack:function(d){ delete d.faces; delete d.alive; d.mode='gioca'; },
  prepare:function(d){ d.mode='gioca'; TOOLS.mahjong.newDeal(d); },
  bind:function(ctx){ TOOLS.mahjong.bind(ctx); }, render:function(ctx){ TOOLS.mahjong.render(ctx); }, solution:false,
  check:function(ctx){ return TOOLS.mahjong.check(ctx); } };

/* --- crucipuzzle --- */
TOOLS.crucipuzzle.play={ steps:['Tocca la prima lettera di una parola, poi l’ultima.','Se la parola è nell’elenco, viene evidenziata e barrata.'],
  side:function(){ return '<div class="panel"><div id="ws-status" class="explain">Tocca la prima lettera di una parola.</div></div>'; },
  prepare:function(d){ d.found=[]; d.first=null; d.sol=false; },
  render:function(ctx){ var d=ctx.d, r=TOOLS.crucipuzzle.gen(d), cs=60, n=r.n, s='<svg class="main" viewBox="-6 -6 '+(n*cs+12)+' '+(n*cs+12)+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crucipuzzle"><rect x="-4" y="-4" width="'+(n*cs+8)+'" height="'+(n*cs+8)+'" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>';
    r.placed.forEach(function(p){ if(d.found.indexOf(p.word)<0) return; var x1=p.c*cs+cs/2, y1=p.r*cs+cs/2, L=p.word.length-1; s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+(x1+p.dc*L*cs)+'" y2="'+(y1+p.dr*L*cs)+'" stroke="var(--mark)" stroke-width="'+(cs*0.7)+'" stroke-linecap="round" opacity=".8"/>'; });
    for(var y=0;y<n;y++) for(var x=0;x<n;x++){ var f=d.first&&d.first[0]===y&&d.first[1]===x; s+='<rect data-rc="'+y+','+x+'" x="'+(x*cs)+'" y="'+(y*cs)+'" width="'+cs+'" height="'+cs+'" fill="'+(f?'#cfe8ff':'transparent')+'" rx="10"/><g pointer-events="none">'+txt(x*cs+cs/2,y*cs+cs/2+2,r.grid[y][x],32,{anchor:'middle',base:'central'})+'</g>'; }
    var words=r.placed.map(function(p){ return p.word; }).sort();
    ctx.work.innerHTML='<div class="board paper">'+s+'</svg></div><div class="wordlist">'+words.map(function(w){ return '<span'+(d.found.indexOf(w)>=0?' class="found"':'')+'>'+w+'</span>'; }).join('')+'</div>'; },
  bind:function(ctx){ var d=ctx.d; ctx.work.addEventListener('click', function(e){ var c=e.target.closest('[data-rc]'); if(!c) return; var p=c.dataset.rc.split(',').map(Number), st=$('ws-status');
    if(!d.first){ ctx.quiet(function(){ d.first=p; }); st.textContent='Ora tocca l’ultima lettera.'; return; }
    var a=d.first, r=TOOLS.crucipuzzle.gen(d), hit=r.placed.filter(function(w){ var L=w.word.length-1, e1=[w.r+w.dr*L, w.c+w.dc*L]; return (w.r===a[0]&&w.c===a[1]&&e1[0]===p[0]&&e1[1]===p[1]) || (w.r===p[0]&&w.c===p[1]&&e1[0]===a[0]&&e1[1]===a[1]); })[0];
    if(hit && d.found.indexOf(hit.word)<0){ ctx.change(function(){ d.found.push(hit.word); d.first=null; }); st.textContent='Trovata: '+hit.word+'! ('+d.found.length+' su '+r.placed.length+')'; }
    else { ctx.quiet(function(){ d.first=null; }); st.textContent='Non è una parola dell’elenco: riprova.'; } }); },
  check:function(ctx){ var r=TOOLS.crucipuzzle.gen(ctx.d), f=ctx.d.found.length; return f===r.placed.length ? okMsg('Tutte trovate! Complimenti.', r.keyFits?'Ora leggi le lettere rimaste: formano la frase chiave.':'') : infoMsg('Trovate '+f+' parole su '+r.placed.length+'.',''); } };

/* --- enigma logico --- */
TOOLS.logica.play={ steps:['Leggi gli indizi e usa la griglia per segnare X (impossibile) e cerchi (certo): tocca una casella per cambiare segno.','Compila la tabella delle risposte con i menù.','Controlla ti dice quante risposte sono giuste.'],
  prepare:function(d){ d.ans={}; d.marks={}; d.team=false; },
  render:function(ctx){ var d=ctx.d, me=TOOLS.logica, p=me.puzzle(d); if(!p){ ctx.work.innerHTML='<p class="note">Enigma non valido.</p>'; return; }
    var clues=p.clues.map(function(cl){ return me.clueText(d,cl); }), cats=d.cats.slice(0,d.k-1);
    var grid=me.grid(d), cs=34, lab=120, n=d.n, k=d.k, colC=[], rowC=[0]; for(var c=1;c<k;c++) colC.push(c); for(var r=k-1;r>=2;r--) rowC.push(r);
    // caselle cliccabili sopra la griglia
    var marks=''; rowC.forEach(function(rc,i){ colC.forEach(function(cc,j){ if(j>=colC.length-i) return; for(var a=0;a<n;a++) for(var b=0;b<n;b++){ var key=rc+'.'+a+'.'+cc+'.'+b, x=lab+j*n*cs+b*cs, y=lab+i*n*cs+a*cs, m=d.marks[key]; marks+='<rect data-mk="'+key+'" x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="transparent"/>'+(m===1?'<path d="M'+(x+9)+' '+(y+9)+'l16 16M'+(x+25)+' '+(y+9)+'l-16 16" stroke="#b3261e" stroke-width="3" pointer-events="none"/>':m===2?'<circle cx="'+(x+cs/2)+'" cy="'+(y+cs/2)+'" r="10" fill="none" stroke="#1e7a3c" stroke-width="3" pointer-events="none"/>':''); } }); });
    grid=grid.replace('</svg>', marks+'</svg>');
    var tab='<table class="ltab"><thead><tr><th>'+cap(d.pos.label)+'</th>'+cats.map(function(c){ return '<th>'+esc(c.name)+'</th>'; }).join('')+'</tr></thead><tbody>';
    for(var i=0;i<n;i++){ tab+='<tr><th>'+(i+1)+'</th>'; for(var c2=1;c2<k;c2++){ var v=d.ans[i+'.'+c2]; tab+='<td><select data-ans="'+i+'.'+c2+'" aria-label="'+esc(cats[c2-1].name)+' '+(i+1)+'"><option value="">—</option>'+me.vals(d,c2-1).map(function(x,vi){ return '<option value="'+vi+'"'+(String(v)===String(vi)?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</select></td>'; } tab+='</tr>'; }
    ctx.work.innerHTML='<div class="sheettext logic"><p>'+esc(me.intro2(d))+'</p><h3>Indizi</h3><ol>'+clues.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ol><h3>Griglia per ragionare</h3>'+grid+'<h3>Risposta</h3><div class="tablewrap">'+tab+'</tbody></table></div></div>'; },
  bind:function(ctx){ var d=ctx.d; ctx.work.addEventListener('click', function(e){ var m=e.target.closest('[data-mk]'); if(m) ctx.change(function(){ var k=m.dataset.mk; d.marks[k]=((d.marks[k]||0)+1)%3; if(!d.marks[k]) delete d.marks[k]; }); });
    ctx.work.addEventListener('change', function(e){ var s=e.target.dataset.ans; if(s!==undefined) ctx.change(function(){ if(e.target.value==='') delete d.ans[s]; else d.ans[s]=+e.target.value; }); }); },
  check:function(ctx){ var d=ctx.d, p=TOOLS.logica.puzzle(d), ok=0, tot=d.n*(d.k-1), filled=0; for(var i=0;i<d.n;i++) for(var c=1;c<d.k;c++){ var v=d.ans[i+'.'+c]; if(v===undefined) continue; filled++; if(v===p.sol[c][i]) ok++; }
    return ok===tot ? okMsg('Risolto! Ogni casella è giusta.','') : infoMsg('Risposte giuste: '+ok+' su '+tot+'.', filled>ok ? 'Qualcuna va ricontrollata.' : 'Continua così.'); } };

/* --- Kakuro --- */
TOOLS.kakuro.play={ steps:['Tocca una casella bianca e poi una cifra.','In ogni tratto le cifre sono tutte diverse e la loro somma è scritta nella casella nera.'],
  side:function(){ var h='<div class="panel"><div class="padsym" id="kk-pad">'; for(var v=1;v<=9;v++) h+='<button class="btn" data-p="'+v+'">'+v+'</button>'; return h+'<button class="btn" data-p="0">Cancella</button></div><label class="check"><input type="checkbox" id="c-perr"> Segna gli errori in rosso</label></div>'; },
  prepare:function(d){ d.pl={}; d.psel=null; d.perr=false; },
  render:function(ctx){ var d=ctx.d, base=TOOLS.kakuro.svg(d,'puzzle'), n=d.n, cs=Math.round(600/n), add='';
    if(d.made) for(var k in d.made.val){ if(d.made.givens[k]!==undefined) continue; var r=Math.floor(k/n), c=k%n, x=c*cs, y=r*cs, v=d.pl[k], sel=d.psel===+k, bad=d.perr&&v&&v!==d.made.val[k];
      add+='<rect data-cell="'+k+'" x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="'+(sel?'var(--mark)':bad?'#ffd9d4':'transparent')+'" stroke="none"/>'+(v?'<g pointer-events="none">'+txt(x+cs/2,y+cs/2+2,String(v),cs*0.5,{anchor:'middle',base:'central',fill:'var(--accent)'})+'</g>':''); }
    ctx.work.innerHTML='<div class="board paper">'+base.replace('</svg>',add+'</svg>')+'</div>'; },
  bind:function(ctx){ var d=ctx.d; ctx.work.addEventListener('click', function(e){ var c=e.target.closest('[data-cell]'); if(c) ctx.quiet(function(){ d.psel=+c.dataset.cell; }); });
    $('kk-pad').addEventListener('click', function(e){ var b=e.target.closest('[data-p]'); if(!b||d.psel===null) return; ctx.change(function(){ var v=+b.dataset.p; if(v) d.pl[d.psel]=v; else delete d.pl[d.psel]; }); });
    $('c-perr').onchange=function(e){ ctx.quiet(function(){ d.perr=e.target.checked; }); }; },
  check:function(ctx){ var d=ctx.d, tot=0, empty=0, wrong=0; for(var k in d.made.val){ if(d.made.givens[k]!==undefined) continue; tot++; if(!d.pl[k]) empty++; else if(d.pl[k]!==d.made.val[k]) wrong++; }
    return !empty&&!wrong ? okMsg('Risolto! Complimenti.','') : infoMsg('Caselle vuote: '+empty+' su '+tot+'.', wrong?wrong+' cifre da ricontrollare.':'Finora nessun errore.'); } };

/* --- crucipixel --- */
TOOLS.crucipixel.play={ steps:['Tocca una casella per colorarla; toccala ancora per segnarla con un puntino (vuota sicura); una terza volta per cancellare.','I numeri dicono quante caselle colorate di fila ci sono, nell’ordine.'],
  prepare:function(d){ d.pg=grid0(d.n); },
  render:function(ctx){ var d=ctx.d, show={ n:d.n, g:d.pg.map(function(r){ return r.map(function(v){ return v===1?1:0; }); }) }, base=TOOLS.crucipixel.svg({ n:d.n, g:d.g },'puzzle');
    // sovrappone le caselle del giocatore
    var cl=NonoCore.clues(d.g), cs=Math.max(26, Math.round(560/d.n)), fs=Math.min(22, cs*0.55), mr=Math.max(1,Math.max.apply(null,cl.rows.map(function(x){ return x.length; }))), mc=Math.max(1,Math.max.apply(null,cl.cols.map(function(x){ return x.length; }))), L=mr*fs*1.25+10, T=mc*fs*1.15+10, add='';
    for(var r=0;r<d.n;r++) for(var c=0;c<d.n;c++){ var v=d.pg[r][c], x=L+c*cs, y=T+r*cs; add+='<rect data-rc="'+r+','+c+'" x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" fill="'+(v===1?'var(--ink)':'transparent')+'"/>'+(v===2?'<circle cx="'+(x+cs/2)+'" cy="'+(y+cs/2)+'" r="'+(cs*0.12)+'" fill="var(--graphite)" pointer-events="none"/>':''); }
    ctx.work.innerHTML='<div class="boardfree nono">'+base.replace(/data-rc="[^"]*"/g,'').replace('</svg>',add+'</svg>')+'</div>'; },
  bind:function(ctx){ var d=ctx.d; ctx.work.addEventListener('click', function(e){ var c=e.target.closest('[data-rc]'); if(!c) return; var p=c.dataset.rc.split(',').map(Number); ctx.change(function(){ d.pg[p[0]][p[1]]=(d.pg[p[0]][p[1]]+1)%3; }); }); },
  check:function(ctx){ var d=ctx.d, mine=d.pg.map(function(r){ return r.map(function(v){ return v===1?1:0; }); }), a=NonoCore.clues(mine), b=NonoCore.clues(d.g);
    return JSON.stringify(a)===JSON.stringify(b) ? okMsg('Risolto! Ecco il disegno.','') : infoMsg('Non ancora.','Righe giuste: '+a.rows.filter(function(x,i){ return JSON.stringify(x)===JSON.stringify(b.rows[i]); }).length+' su '+d.n+'.'); } };

/* --- anagrammi e indovinelli --- */
TOOLS.anagrammi.play={ steps:['Scrivi la tua risposta sotto ogni anagramma e ogni indovinello.','Controlla ti dice quante sono giuste.'],
  prepare:function(d){ d.risp={}; },
  render:function(ctx){ var d=ctx.d, it=TOOLS.anagrammi.items(d), h='<div class="sheettext">';
    if(it.ana.length) h+='<h3>Anagrammi</h3><ol class="anlist">'+it.ana.map(function(a,i){ return '<li><span class="tiles">'+a.mix.split('').map(function(c){ return '<b>'+c+'</b>'; }).join('')+'</span>'+(a.hint?'<span class="hint">'+esc(a.hint)+'</span>':'')+'<input class="wide" data-r="a'+i+'" value="'+esc(d.risp['a'+i]||'')+'" aria-label="Risposta" autocapitalize="characters"></li>'; }).join('')+'</ol>';
    if(it.ind.length) h+='<h3>Indovinelli</h3><ol class="indlist">'+it.ind.map(function(x,i){ return '<li>'+esc(x.q)+'<input class="wide" data-r="i'+i+'" value="'+esc(d.risp['i'+i]||'')+'" aria-label="Risposta"></li>'; }).join('')+'</ol>';
    ctx.work.innerHTML=h+'</div>'; },
  bind:function(ctx){ var d=ctx.d; ctx.work.addEventListener('input', function(e){ var k=e.target.dataset.r; if(k){ d.risp[k]=e.target.value; ctx.persist(); } }); },
  check:function(ctx){ var d=ctx.d, it=TOOLS.anagrammi.items(d), ok=0, tot=it.ana.length+it.ind.length, strip=function(s){ return WordCore.norm(String(s||'').replace(/^(il|lo|la|i|gli|le|l'|un|uno|una|un')\s*/i,'')); };
    it.ana.forEach(function(a,i){ if(WordCore.norm(d.risp['a'+i])===a.word) ok++; }); it.ind.forEach(function(x,i){ if(x.a && strip(d.risp['i'+i])===strip(x.a)) ok++; });
    return ok===tot ? okMsg('Tutte giuste! Complimenti.','') : infoMsg('Giuste: '+ok+' su '+tot+'.','Per gli indovinelli conta la parola, non l’articolo.'); } };

/* ===================== GUIDA: COME SI USA ===================== */
function renderGuide(){
  var sec=function(id, t, body){ return '<section class="gsec" id="g-'+id+'"><h2>'+t+'</h2>'+body+'</section>'; };
  var toc=[['cose','Che cos’è AttivaMente'],['crea','Creare un gioco'],['salva','Salvare e ritrovare i lavori'],['stampa','Stampare e fare un PDF'],['condividi','Condividere un gioco da giocare'],['installa','Installarla sul telefono'],['accesso','Accessibilità'],['prove','I livelli di prova'],['squadra','Giochi di squadra'],['privacy','Privacy e limiti'],['faq','Domande frequenti']];
  var html='<section class="toolhead"><h1>Come si usa</h1><p>Tutto quello che serve per creare, stampare e regalare i giochi. Si legge in dieci minuti; puoi anche saltare direttamente alla parte che ti interessa.</p></section><div class="guide"><nav class="gtoc" aria-label="Indice"><ol>'+toc.map(function(x){ return '<li><a href="#guida" data-g="'+x[0]+'">'+x[1]+'</a></li>'; }).join('')+'</ol></nav><div class="gbody">'+
  sec('cose','Che cos’è AttivaMente','<p>È un laboratorio per <b>creare</b> giochi: labirinti, mandala, cruciverba, sudoku, Mahjong e molti altri. Non è un’app che fa giocare al posto tuo: sei tu a disegnare, scegliere le parole, costruire lo schema. L’app fa il lavoro noioso e rigoroso: controlla che il gioco funzioni, che la soluzione sia una sola, prepara la stampa e la soluzione.</p><p>Funziona su telefono, tablet e computer, gratis, senza account e senza pubblicità.</p>')+
  sec('crea','Creare un gioco','<ol class="gsteps"><li><b>Scegli un gioco</b> dalla pagina <a href="#home">Giochi</a>. I giochi sono divisi in famiglie: Disegno e spazio, Parole, Numeri logica e tavolo, Squadra.</li><li><b>Segui il riquadro Passo passo</b> a destra (sul telefono, sotto il foglio). Con il pulsante a forma di altoparlante le istruzioni vengono lette ad alta voce.</li><li><b>Crea</b>: tocca, disegna, scrivi. Non si può sbagliare: <b>Annulla</b> torna indietro di un passo, <b>Ripeti</b> lo rifà, <b>Ricomincia da capo</b> dà un foglio nuovo (e anche quello si annulla).</li><li><b>Premi Controlla</b>: l’app ti dice se il gioco funziona e, se no, che cosa sistemare. Per esempio: la strada del labirinto arriva all’uscita? Il sudoku ha una sola soluzione? Le parole del cruciverba esistono?</li><li><b>Dai un titolo e una dedica</b> nel riquadro "Per chi è?": compaiono in cima al foglio stampato.</li></ol><p class="evidence">Alcuni giochi usano il dizionario italiano (cruciverba a schema, crittografato, anagrammi, ruota di lettere). La prima volta serve la connessione per scaricarlo (circa 3 MB); poi resta sul dispositivo.</p>')+
  sec('salva','Salvare e ritrovare i lavori','<p>Mentre lavori, l’app ricorda da sola l’ultimo foglio di ogni gioco. Per tenere un gioco per sempre premi <b>Salva nei miei lavori</b>: lo ritrovi nella pagina <a href="#lavori">I miei lavori</a>, dove puoi aprirlo, duplicarlo (per farne una variante) o eliminarlo.</p><p>Per spostare i lavori su un altro dispositivo usa <b>Esporta file</b> (oppure <b>Copia come testo</b>) e poi <b>Importa</b> sull’altro dispositivo.</p>')+
  sec('stampa','Stampare e fare un PDF','<p>Il pulsante <b>Stampa</b> prepara un foglio pulito: senza pulsanti, con titolo e dedica, la soluzione su una pagina a parte (puoi toglierla) e, quando servono, i pezzi da ritagliare.</p><p><b>Per ottenere un PDF</b> da mandare per email o WhatsApp: premi Stampa e, nella finestra che si apre, scegli come stampante <b>"Salva come PDF"</b> (sul telefono Android: "Salva come PDF"; su iPhone: tocca l’anteprima con due dita allargandole, poi Condividi). Il PDF si apre ovunque, anche senza AttivaMente.</p><p>Consigli: carta da 120–160 g per i giochi da colorare, cartoncino da 200 g o più per tessere e pezzi da ritagliare; stampa sempre "al 100%" o "dimensioni reali".</p><p>"Scarica immagine" salva il disegno in formato SVG, che resta nitido a qualsiasi grandezza (utile per impaginare un libretto). Alcuni telefoni non lo mostrano: per mandare un gioco a qualcuno è meglio il PDF o il link.</p>')+
  sec('condividi','Condividere un gioco da giocare','<p>In sudoku, Mahjong, cruciverba, crittografato, crucipuzzle, enigma logico, Kakuro, Ponti, crucipixel e anagrammi c’è il riquadro <b>Condividi da giocare</b>.</p><ol class="gsteps"><li>Premi <b>Crea il link da giocare</b>.</li><li>Scegli come mandarlo: <b>Copia il link</b> (e incollalo in un messaggio), <b>Invia…</b> (apre WhatsApp, email e le altre app del telefono) oppure <b>Mostra il QR code</b> (da stampare su un biglietto, un invito, una scheda del corso).</li><li>Chi lo apre trova il gioco pronto: può risolverlo sullo schermo, controllare, vedere la soluzione solo se la chiede, stamparlo. I suoi progressi restano salvati sul suo telefono.</li></ol><p class="evidence">Il gioco viaggia dentro il link: non passa da nessun server e non viene salvato da nessuna parte. Per lo stesso motivo, chi riceve il link potrebbe in teoria ricavarne la soluzione: va benissimo per giocare, non per gare o esami.</p>')+
  sec('installa','Installarla sul telefono','<p>AttivaMente si installa come un’app, senza passare dagli store, e dopo la prima apertura funziona anche senza connessione.</p><ul><li><b>Android (Chrome):</b> apri l’indirizzo dell’app, tocca i tre puntini in alto a destra, poi <b>Installa app</b> o <b>Aggiungi a schermata Home</b>.</li><li><b>iPhone e iPad (Safari):</b> tocca il pulsante Condividi (il quadrato con la freccia), poi <b>Aggiungi alla schermata Home</b>.</li><li><b>Computer (Chrome o Edge):</b> nella barra dell’indirizzo compare l’icona Installa.</li></ul>')+
  sec('accesso','Accessibilità','<p>Nella pagina <a href="#accessibilita">Accessibilità</a> scegli una volta come preferisci lavorare; vale per tutti i giochi.</p><ul><li><b>Profili pronti</b>, per esempio "Mani tremanti" o "Un passo alla volta".</li><li><b>Testo grande</b> e <b>molto grande</b>, <b>contrasto alto</b>, <b>nessuna animazione</b>.</li><li><b>Mani tremanti:</b> si tocca invece di trascinare, i comandi diventano più grandi, le linee vengono ammorbidite.</li><li><b>Lettura ad alta voce</b> delle istruzioni.</li><li>Nel sudoku puoi usare <b>forme colorate</b> al posto dei numeri; nel Mahjong le <b>tessere facili</b> con numeri e colori grandi; nella dama colori che si distinguono anche con il daltonismo.</li></ul>')+
  sec('prove','I livelli di prova','<p>Ogni gioco ha un’etichetta che riassume che cosa dicono oggi gli studi:</p><ul><li><span class="chip solido">Prova solida</span> almeno uno studio controllato con risultati positivi (per esempio cruciverba e sudoku negli anziani, percorsi numerati nei bambini).</li><li><span class="chip promettente">Prova promettente</span> studi piccoli o osservazionali con segnali coerenti (mandala, disegno a motivi).</li><li><span class="chip plausibile">Prova plausibile</span> nessuno studio specifico: il gioco è proposto per analogia con giochi studiati.</li></ul><p>Nessun gioco è una cura. Può accompagnare, non sostituire, l’aiuto di medici, terapisti e insegnanti.</p>')+
